# =============================================================================
# agent1 — DB Credentials Secret
# Replace plaintext values with base64-encoded strings before applying:
#   echo -n 'value' | base64
# For production, use AWS Secrets Manager + External Secrets Operator:
#   https://external-secrets.io/
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agent1-db-secret
  namespace: agent1
type: Opaque
stringData:                                        # stringData auto-encodes to base64
  db-username: app
  db-password: app                                 # CHANGE in production
  inventory-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent1_inventory
  sales-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent1_sales
  revenue-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent1_revenue
  products-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent1_products
