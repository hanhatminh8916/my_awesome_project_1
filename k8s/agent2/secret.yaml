# =============================================================================
# agent2 — DB Credentials Secret
# Replace <RDS_ENDPOINT> with your Amazon RDS endpoint.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agent2-db-secret
  namespace: agent2
type: Opaque
stringData:
  db-username: app
  db-password: app                                 # CHANGE in production
  inventory-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent2_inventory
  sales-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent2_sales
  revenue-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent2_revenue
  products-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/agent2_products
