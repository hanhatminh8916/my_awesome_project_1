# =============================================================================
# IAM Roles for Service Accounts (IRSA) — AWS EKS
#
# Prerequisites:
#   1. Enable OIDC provider for your EKS cluster:
#        eksctl utils associate-iam-oidc-provider --cluster <cluster-name> --approve
#   2. Create IAM roles with trust policy for each service account:
#        eksctl create iamserviceaccount \
#          --cluster <cluster-name> \
#          --namespace agent1 \
#          --name agent1-service-account \
#          --attach-policy-arn arn:aws:iam::aws:policy/AmazonRDSFullAccess \
#          --approve
#
# Replace <AWS_ACCOUNT_ID> and <EKS_CLUSTER_NAME> with your values.
# =============================================================================

# ── agent1 ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent1-service-account
  namespace: agent1
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-agent1-role
---
# ── agent2 ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent2-service-account
  namespace: agent2
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-agent2-role
---
# ── manager ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-service-account
  namespace: manager
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-manager-role
---
# ── Prometheus (monitoring) ─────────────────────────────────────────────────
# Needs permission to list nodes, pods, services across all namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-prometheus-role
---
# ── Filebeat (monitoring) ───────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-filebeat-role
