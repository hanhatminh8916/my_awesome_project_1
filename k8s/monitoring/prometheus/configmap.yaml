# =============================================================================
# Prometheus — ConfigMap
# Contains prometheus.yml with Kubernetes service discovery for all
# microservices (annotation-based), plus the alert rules.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      scrape_timeout:      10s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager.monitoring.svc.cluster.local:9093]

    scrape_configs:

      # ── Prometheus self-monitoring ──────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      # ── Kubernetes pods with prometheus.io/scrape: "true" annotation ────────
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: job

      # ── Kubernetes services with prometheus.io/scrape: "true" annotation ────
      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: job

      # ── Kubernetes nodes (kubelet metrics) ──────────────────────────────────
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # ── cAdvisor (container resource metrics) ───────────────────────────────
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  alert_rules.yml: |
    groups:
      - name: service-health
        rules:

          - alert: ServiceDown
            expr: up == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: >-
                Service {{ $labels.job }} (instance {{ $labels.instance }}) has been
                unreachable for more than 30 seconds.

          - alert: ServiceMissing
            expr: |
              absent(up{job="inventory-service",namespace="agent1"}) or
              absent(up{job="order-service",namespace="agent1"}) or
              absent(up{job="product-service",namespace="agent1"}) or
              absent(up{job="revenue-service",namespace="agent1"}) or
              absent(up{job="inventory-service",namespace="agent2"}) or
              absent(up{job="order-service",namespace="agent2"}) or
              absent(up{job="product-service",namespace="agent2"}) or
              absent(up{job="revenue-service",namespace="agent2"}) or
              absent(up{job="central-api-gateway",namespace="manager"}) or
              absent(up{job="data-aggregation-service",namespace="manager"}) or
              absent(up{job="central-analytics-service",namespace="manager"}) or
              absent(up{job="alert-service",namespace="manager"}) or
              absent(up{job="automation-action-service",namespace="manager"}) or
              absent(up{job="report-service",namespace="manager"}) or
              absent(up{job="master-data-service",namespace="manager"}) or
              absent(up{job="ml-bridge-service",namespace="manager"}) or
              absent(up{job="ml-model-service",namespace="manager"}) or
              absent(up{job="postgres",namespace="default"})
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is missing"
              description: >-
                Service {{ $labels.job }} in namespace {{ $labels.namespace }} has no
                scrape target in Prometheus for more than 30 seconds.

          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[1m])) by (job)
                /
                sum(rate(http_server_requests_seconds_count[1m])) by (job)
              ) > 0.1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate on {{ $labels.job }}"
              description: >-
                The error rate for {{ $labels.job }} is {{ humanizePercentage $value }}
                (threshold: 10 %). Sustained for more than 1 minute.

          - alert: HighJvmHeapMemory
            expr: |
              (
                sum(jvm_memory_used_bytes{area="heap"}) by (job, instance)
                /
                sum(jvm_memory_max_bytes{area="heap"} > 0) by (job, instance)
              ) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High JVM heap usage on {{ $labels.job }}"
              description: >-
                JVM heap memory for {{ $labels.job }} ({{ $labels.instance }}) is
                {{ humanizePercentage $value }}, exceeding 80% for more than 2 minutes.

          - alert: HighCpuUsage
            expr: |
              avg(system_cpu_usage) by (job, cluster) > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.job }}"
              description: >-
                CPU usage for {{ $labels.job }} (cluster {{ $labels.cluster }}) is
                {{ humanizePercentage $value }} and has exceeded 85 % for more than 2 minutes.

          - alert: HighJvmHeapUsedBytes
            expr: |
              sum(jvm_memory_used_bytes{area="heap"}) by (job, cluster) > 250000000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High JVM heap bytes on {{ $labels.job }}"
              description: >-
                JVM heap memory used by {{ $labels.job }} (cluster {{ $labels.cluster }})
                is above 250 MB for more than 2 minutes.

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 > 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted more than once in 5 minutes."

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
              description: "Pod {{ $labels.pod }} has been in a non-ready state for more than 5 minutes."
