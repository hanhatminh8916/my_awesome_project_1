# =============================================================================
# manager — DB Credentials Secret
# Replace <RDS_ENDPOINT> with your Amazon RDS endpoint.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: manager-db-secret
  namespace: manager
type: Opaque
stringData:
  db-username: app
  db-password: app                                      # CHANGE in production
  gateway-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_api_gateway
  aggregation-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_aggregation
  analytics-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_analytics
  alert-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_alert
  automation-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_automation
  report-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_report
  master-data-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_master_data
  ml-bridge-datasource-url: jdbc:postgresql://<RDS_ENDPOINT>:5432/manager_ml_bridge
