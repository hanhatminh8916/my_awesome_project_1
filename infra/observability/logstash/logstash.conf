input {
  # ── Filebeat ships Docker container stdout/stderr ──────────────────────────
  beats {
    port => 5044
  }

  # ── Spring Boot LogstashTcpSocketAppender (direct TCP) ────────────────────
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # ── FILEBEAT PATH ───────────────────────────────────────────────────────────
  # Docker stdout lines contain the JSON produced by CONSOLE_JSON appender.
  # Parse that embedded JSON and promote its fields to the root event.
  if [@metadata][beat] == "filebeat" {
    if [message] =~ /^\s*\{/ {
      json {
        source               => "message"
        skip_on_invalid_json => true
      }
      mutate { remove_field => ["message"] }
    }

    # Fallback: if cluster field not present in JSON, derive from container name
    if ![cluster] and [container][name] {
      grok {
        match        => { "[container][name]" => "(?<cluster>agent1|agent2|manager)-.+" }
        tag_on_failure => []
      }
    }

    # Remove noisy Beats / ECS metadata fields
    mutate {
      remove_field => ["agent", "ecs", "input", "log", "event", "host", "@version"]
    }
  } else {
    # TCP path – codec already parsed JSON into root fields
    mutate { remove_field => ["@version", "port"] }
  }

  # ── NORMALIZE TIMESTAMP ─────────────────────────────────────────────────────
  # LogstashEncoder renames @timestamp → timestamp (via <fieldNames>).
  # Re-parse it and set Logstash's @timestamp.
  if [timestamp] {
    date {
      match        => ["timestamp", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ── EXCEPTION ENRICHMENT ────────────────────────────────────────────────────
  # TCP path uses field name "exception" (from encoder <fieldNames>).
  # If stack_trace is present (old format or filebeat path), rename it.
  if [stack_trace] and ![exception] {
    mutate { rename => { "stack_trace" => "exception" } }
  }

  if [exception] {
    # Extract the top-level exception class (e.g. java.lang.NullPointerException)
    grok {
      match          => { "exception" => "(?<exception_class>(?:[a-zA-Z$_][a-zA-Z0-9$_.]*\\.)*[A-Z][a-zA-Z0-9$_]*(?:Exception|Error)[^\n\r]*)" }
      tag_on_failure => []
    }
    mutate { add_field => { "has_exception" => true } }
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch:9200"]
    index  => "microservices-logs-%{+YYYY.MM.dd}"
    action => "index"
  }

  # Comment out or remove in production to reduce Logstash noise
  stdout {
    codec => rubydebug
  }
}
