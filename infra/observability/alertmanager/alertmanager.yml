global:
  resolve_timeout: 5m

route:
  receiver: alert-service-webhook
  group_by: ['alertname', 'job', 'cluster']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m

receivers:
  - name: alert-service-webhook
    webhook_configs:
      - url: http://manager-alert-service:8093/api/alerts/prometheus
        send_resolved: true
