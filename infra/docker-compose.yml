    ports:
      - "5451:5432"
    volumes:
      - manager_aggregation_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  manager-analytics-db:
    image: postgres:16-alpine
    container_name: manager-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_analytics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5452:5432"
    volumes:
      - manager_analytics_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  manager-alert-db:
