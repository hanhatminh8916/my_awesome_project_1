services:
  # ---------- Databases: Agent 1 ----------
  agent1-sales-db:
    image: postgres:16-alpine
    container_name: agent1-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent1_sales
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - agent1_sales_db_data:/var/lib/postgresql/data
    networks: [agent1-net]

  agent1-inventory-db:
    image: postgres:16-alpine
    container_name: agent1-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent1_inventory
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    volumes:
      - agent1_inventory_db_data:/var/lib/postgresql/data
    networks: [agent1-net]

  agent1-revenue-db:
    image: postgres:16-alpine
    container_name: agent1-revenue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent1_revenue
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5435:5432"
    volumes:
      - agent1_revenue_db_data:/var/lib/postgresql/data
