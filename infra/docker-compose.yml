      args:
        SERVICE_DIR: agent1/productService
    container_name: agent1-product-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      APP_CLUSTER: agent1
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
