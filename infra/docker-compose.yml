    networks: [agent1-net]

  # ---------- Databases: Agent 2 ----------
  agent2-sales-db:
    image: postgres:16-alpine
    container_name: agent2-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent2_sales
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5443:5432"
    volumes:
      - agent2_sales_db_data:/var/lib/postgresql/data
    networks: [agent2-net]

  agent2-inventory-db:
    image: postgres:16-alpine
    container_name: agent2-inventory-db
    restart: unless-stopped
    environment:
