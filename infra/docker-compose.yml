      - "5444:5432"
    volumes:
      - agent2_inventory_db_data:/var/lib/postgresql/data
    networks: [agent2-net]

  agent2-revenue-db:
    image: postgres:16-alpine
    container_name: agent2-revenue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent2_revenue
