    restart: unless-stopped
    environment:
      POSTGRES_DB: agent2_products
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5446:5432"
    volumes:
      - agent2_product_db_data:/var/lib/postgresql/data
    networks: [agent2-net]

  # ---------- Databases: Manager ----------
  manager-aggregation-db:
    image: postgres:16-alpine
    container_name: manager-aggregation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_aggregation
      POSTGRES_USER: app
