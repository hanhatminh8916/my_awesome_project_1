      SPRING_DATASOURCE_URL: jdbc:postgresql://manager-ml-bridge-db:5432/manager_ml_bridge
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      ML_MODEL_URL: http://ml-model-service:8000
      PROMETHEUS_URL: http://prometheus:9090
      ALERT_SERVICE_URL: http://manager-alert-service:8093
    ports:
      - "8097:8097"
    depends_on:
      - manager-ml-bridge-db
      - logstash
      - ml-model-service
      - manager-alert-service
    networks:
      - manager-net
      - app-observability-net

  manager-central-api-gateway-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-boot
      args:
        SERVICE_DIR: manager/centralAPIGateway
    container_name: manager-central-api-gateway-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8090
      APP_CLUSTER: manager
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://manager-api-gateway-db:5432/manager_api_gateway
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8090:8090"
    depends_on:
      - manager-api-gateway-db
      - logstash
    networks:
      - manager-net
      - app-observability-net

