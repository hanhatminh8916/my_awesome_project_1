    networks: [manager-net]

  manager-report-db:
    image: postgres:16-alpine
    container_name: manager-report-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_report
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5455:5432"
    volumes:
      - manager_report_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  manager-master-data-db:
    image: postgres:16-alpine
    container_name: manager-master-data-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_master_data
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5456:5432"
    volumes:
      - manager_master_data_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  manager-ml-bridge-db:
    image: postgres:16-alpine
    container_name: manager-ml-bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_ml_bridge
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5457:5432"
    volumes:
      - manager_ml_bridge_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  manager-api-gateway-db:
    image: postgres:16-alpine
    container_name: manager-api-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager_api_gateway
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5458:5432"
    volumes:
      - manager_api_gateway_db_data:/var/lib/postgresql/data
    networks: [manager-net]

  # ---------- ELK ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [observability-net]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5000:5000"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability-net
      - app-observability-net

  # ---------- Alertmanager ----------
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - observability-net
      - app-observability-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [observability-net]

  # ---------- Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability-net
      - app-observability-net

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - observability-net

  # ---------- Filebeat ----------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - observability-net
      - app-observability-net

  # ---------- FastAPI ML Model service ----------
  ml-model-service:
    profiles: ["apps"]
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: ml-model-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - manager-net
      - app-observability-net

  # ---------- Spring Boot placeholders (enable with --profile apps) ----------
  agent1-inventory-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-boot
      args:
        SERVICE_DIR: agent1/inventoryService
    container_name: agent1-inventory-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      APP_CLUSTER: agent1
      PRODUCT_SERVICE_URL: http://agent1-product-service:8084
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://agent1-inventory-db:5432/agent1_inventory
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8081:8081"
    depends_on:
      - agent1-inventory-db
      - logstash
    networks:
      - agent1-net
      - app-observability-net

  agent1-order-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-boot
      args:
        SERVICE_DIR: agent1/orderService
    container_name: agent1-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      APP_CLUSTER: agent1
      INVENTORY_SERVICE_URL: http://agent1-inventory-service:8081
      PRODUCT_SERVICE_URL: http://agent1-product-service:8084
      APP_AGENT_ID: agent1
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://agent1-sales-db:5432/agent1_sales
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8082:8082"
    depends_on:
      - agent1-sales-db
      - agent1-inventory-service
      - agent1-product-service
      - logstash
