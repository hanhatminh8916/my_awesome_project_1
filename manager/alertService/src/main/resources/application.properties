spring.application.name=alertService
server.port=8080

# ── Actuator & Prometheus ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ── Gmail SMTP ────────────────────────────────────────────────────────────────
# Use environment variables to avoid committing credentials:
#   ALERT_EMAIL_FROM     = your-project@gmail.com
#   ALERT_EMAIL_PASSWORD = 16-char Gmail App Password
#   ALERT_EMAIL_TO       = recipient@example.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ALERT_EMAIL_FROM:your-project@gmail.com}
spring.mail.password=${ALERT_EMAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Alert recipients ──────────────────────────────────────────────────────────
alert.email.from=${ALERT_EMAIL_FROM:your-project@gmail.com}
alert.email.password=${ALERT_EMAIL_PASSWORD:changeme}
alert.email.to=${ALERT_EMAIL_TO:admin@example.com}

# Route-specific mailbox config
alert.email.manager.from=${ALERT_EMAIL_MANAGER_FROM:${ALERT_EMAIL_FROM:your-project@gmail.com}}
alert.email.manager.password=${ALERT_EMAIL_MANAGER_PASSWORD:${ALERT_EMAIL_PASSWORD:changeme}}
alert.email.manager.to=${ALERT_EMAIL_MANAGER_TO:${ALERT_EMAIL_TO:admin@example.com}}

alert.email.inventory.from=${ALERT_EMAIL_INVENTORY_FROM:${ALERT_EMAIL_FROM:your-project@gmail.com}}
alert.email.inventory.password=${ALERT_EMAIL_INVENTORY_PASSWORD:${ALERT_EMAIL_PASSWORD:changeme}}
alert.email.inventory.to=${ALERT_EMAIL_INVENTORY_TO:${ALERT_EMAIL_TO:admin@example.com}}

alert.email.order.from=${ALERT_EMAIL_ORDER_FROM:${ALERT_EMAIL_FROM:your-project@gmail.com}}
alert.email.order.password=${ALERT_EMAIL_ORDER_PASSWORD:${ALERT_EMAIL_PASSWORD:changeme}}
alert.email.order.to=${ALERT_EMAIL_ORDER_TO:${ALERT_EMAIL_TO:admin@example.com}}

alert.email.revenue.from=${ALERT_EMAIL_REVENUE_FROM:${ALERT_EMAIL_FROM:your-project@gmail.com}}
alert.email.revenue.password=${ALERT_EMAIL_REVENUE_PASSWORD:${ALERT_EMAIL_PASSWORD:changeme}}
alert.email.revenue.to=${ALERT_EMAIL_REVENUE_TO:${ALERT_EMAIL_TO:admin@example.com}}

alert.email.product.from=${ALERT_EMAIL_PRODUCT_FROM:${ALERT_EMAIL_FROM:your-project@gmail.com}}
alert.email.product.password=${ALERT_EMAIL_PRODUCT_PASSWORD:${ALERT_EMAIL_PASSWORD:changeme}}
alert.email.product.to=${ALERT_EMAIL_PRODUCT_TO:${ALERT_EMAIL_TO:admin@example.com}}

# Throttle alert emails to avoid Gmail quota lockouts during anomaly bursts.
# Set to 0 to disable throttling.
alert.email.cooldown-seconds=${ALERT_EMAIL_COOLDOWN_SECONDS:900}
alert.email.global-cooldown-seconds=${ALERT_EMAIL_GLOBAL_COOLDOWN_SECONDS:30}
alert.email.correlation-window-seconds=${ALERT_EMAIL_CORRELATION_WINDOW_SECONDS:300}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.hatrustsoft=INFO
