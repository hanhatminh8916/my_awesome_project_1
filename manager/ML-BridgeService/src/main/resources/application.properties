spring.application.name=ML-BridgeService
server.port=8080

# ── Actuator & Prometheus ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ── ML Model (FastAPI) ─────────────────────────────────────────────────────
# In-cluster: http://ml-model-service.manager.svc.cluster.local:8000
# Local test:  http://localhost:8000
ml.model.url=${ML_MODEL_URL:http://localhost:8000}

# ── Prometheus ────────────────────────────────────────────────────────────────
# In-cluster: http://prometheus.monitoring.svc.cluster.local:9090
# port-forward: http://localhost:9090
ml.prometheus.url=${PROMETHEUS_URL:http://localhost:9090}

# ── AlertService ──────────────────────────────────────────────────────────────
# In-cluster: http://alert-service.manager.svc.cluster.local:8080
# Local test:  http://localhost:8081
ml.alert-service.url=${ALERT_SERVICE_URL:http://localhost:8093}

# ── Polling scheduler ─────────────────────────────────────────────────────────
ml.polling.interval-ms=30000
ml.polling.initial-delay-ms=15000
ml.alert.dedup.cooldown-ms=900000
ml.anomaly.threshold.override=${ML_ANOMALY_THRESHOLD_OVERRIDE:${ML_ANOMALY_THRESHOLD:0.5}}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.hatrustsoft=INFO
