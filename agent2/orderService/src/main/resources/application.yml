spring:
  application:
    name: orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5443/agent2_sales}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          inventory-service:
            url: ${INVENTORY_SERVICE_URL:http://agent2-inventory-service:8181}
          product-service:
            url: ${PRODUCT_SERVICE_URL:http://agent2-product-service:8184}

app:
  agent-id: ${APP_AGENT_ID:agent2}

server:
  port: 8182

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5000}
