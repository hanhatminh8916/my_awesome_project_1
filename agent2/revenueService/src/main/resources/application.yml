spring:
  application:
    name: revenue
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5445/agent2_revenue}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          order-service:
            url: ${ORDER_SERVICE_URL:http://agent2-order-service:8182}

app:
  agent-id: ${APP_AGENT_ID:agent2}

manager:
  aggregation:
    base-url: ${MANAGER_AGGREGATION_BASE_URL:http://localhost:8091}

server:
  port: 8183

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5000}
